<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Quest 英語闖關</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0c29;
    --card: #1e1b4b;
    --accent1: #f59e0b;
    --accent2: #10b981;
    --accent3: #ef4444;
    --accent4: #6366f1;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --border: rgba(255,255,255,0.08);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Nunito',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; }

  .stars {
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(99,102,241,0.15) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(16,185,129,0.1) 0%, transparent 50%),
      radial-gradient(ellipse at 60% 80%, rgba(245,158,11,0.08) 0%, transparent 50%);
  }
  .stars::before {
    content:''; position:absolute; inset:0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, white, transparent),
      radial-gradient(1px 1px at 30% 60%, white, transparent),
      radial-gradient(1px 1px at 50% 10%, white, transparent),
      radial-gradient(1px 1px at 70% 40%, white, transparent),
      radial-gradient(1px 1px at 85% 75%, white, transparent),
      radial-gradient(1px 1px at 15% 85%, white, transparent),
      radial-gradient(1px 1px at 45% 90%, white, transparent),
      radial-gradient(1px 1px at 90% 15%, white, transparent),
      radial-gradient(2px 2px at 25% 35%, rgba(255,255,255,0.5), transparent),
      radial-gradient(2px 2px at 65% 65%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 55% 55%, white, transparent),
      radial-gradient(1px 1px at 35% 15%, white, transparent),
      radial-gradient(1px 1px at 80% 90%, white, transparent);
    opacity:0.6; animation:twinkle 4s ease-in-out infinite alternate;
  }
  @keyframes twinkle { from{opacity:0.4} to{opacity:0.8} }

  .app { position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column; }

  /* Header */
  header {
    padding:16px 24px; display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--border); background:rgba(15,12,41,0.85);
    backdrop-filter:blur(12px); position:sticky; top:0; z-index:100;
  }
  .logo { font-family:'Fredoka One',cursive; font-size:1.8rem; background:linear-gradient(135deg,var(--accent1),var(--accent4)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .logo span { -webkit-text-fill-color:var(--accent2); }
  .stats-bar { display:flex; gap:12px; align-items:center; }
  .stat-chip { display:flex; align-items:center; gap:6px; background:rgba(255,255,255,0.06); border:1px solid var(--border); border-radius:20px; padding:6px 14px; font-size:0.85rem; font-weight:700; }
  .stat-chip.xp { color:var(--accent1); }
  .stat-chip.streak { color:#f87171; }
  .stat-chip.level { color:var(--accent4); }

  main { flex:1; padding:32px 24px; max-width:900px; margin:0 auto; width:100%; }

  /* Screens */
  #home-screen, #quiz-screen, #results-screen { animation:fadeIn 0.5s ease; }
  #quiz-screen, #results-screen { display:none; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }

  /* Hero */
  .hero { text-align:center; padding:36px 20px 28px; }
  .hero-emoji { font-size:3.5rem; display:block; margin-bottom:10px; animation:bounce 2s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .hero h1 { font-family:'Fredoka One',cursive; font-size:clamp(1.8rem,5vw,2.8rem); background:linear-gradient(135deg,#fff 30%,var(--accent4)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:8px; }
  .hero p { color:var(--muted); font-size:0.95rem; }

  .world-label { font-family:'Fredoka One',cursive; font-size:1rem; color:var(--accent1); text-transform:uppercase; letter-spacing:2px; margin:28px 0 14px; display:flex; align-items:center; gap:10px; }
  .world-label::before,.world-label::after { content:''; flex:1; height:1px; background:var(--border); }

  /* Level Cards */
  .levels-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .level-card { position:relative; background:var(--card); border:2px solid var(--border); border-radius:20px; padding:24px 16px; text-align:center; cursor:pointer; transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1); overflow:hidden; }
  .level-card:hover { transform:translateY(-6px) scale(1.02); }
  .level-card.vocab { border-color:rgba(245,158,11,0.4); }
  .level-card.vocab:hover { border-color:var(--accent1); box-shadow:0 20px 40px rgba(0,0,0,0.4),0 0 30px rgba(245,158,11,0.3); }
  .level-card.grammar { border-color:rgba(99,102,241,0.4); }
  .level-card.grammar:hover { border-color:var(--accent4); box-shadow:0 20px 40px rgba(0,0,0,0.4),0 0 30px rgba(99,102,241,0.3); }
  .level-card.reading { border-color:rgba(16,185,129,0.4); }
  .level-card.reading:hover { border-color:var(--accent2); box-shadow:0 20px 40px rgba(0,0,0,0.4),0 0 30px rgba(16,185,129,0.3); }
  .level-icon { font-size:2.8rem; margin-bottom:10px; display:block; }
  .level-name { font-family:'Fredoka One',cursive; font-size:1.15rem; margin-bottom:6px; }
  .level-card.vocab .level-name { color:var(--accent1); }
  .level-card.grammar .level-name { color:var(--accent4); }
  .level-card.reading .level-name { color:var(--accent2); }
  .level-desc { font-size:0.78rem; color:var(--muted); margin-bottom:14px; line-height:1.5; }
  .level-count { font-size:0.75rem; color:var(--muted); margin-bottom:14px; }
  .level-count span { font-weight:800; color:var(--text); }
  .start-btn { display:inline-block; padding:8px 20px; border-radius:20px; font-size:0.85rem; font-weight:800; border:none; cursor:pointer; font-family:'Nunito',sans-serif; transition:all 0.2s; }
  .level-card.vocab .start-btn { background:var(--accent1); color:#000; }
  .level-card.grammar .start-btn { background:var(--accent4); color:#fff; }
  .level-card.reading .start-btn { background:var(--accent2); color:#000; }
  .start-btn:hover { transform:scale(1.05); filter:brightness(1.1); }

  /* Modal */
  .modal-overlay { position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.7); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; animation:fadeIn 0.2s ease; }
  .modal-box { background:var(--card); border:1px solid var(--border); border-radius:28px; padding:36px 32px; width:min(420px,90vw); text-align:center; animation:popIn 0.3s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes popIn { from{opacity:0;transform:scale(0.8)} to{opacity:1;transform:scale(1)} }
  .modal-icon { font-size:3rem; margin-bottom:10px; }
  .modal-title { font-family:'Fredoka One',cursive; font-size:1.5rem; margin-bottom:4px; }
  .modal-sub { color:var(--muted); font-size:0.88rem; margin-bottom:24px; }
  .count-options { display:flex; gap:12px; justify-content:center; margin-bottom:22px; }
  .count-btn { width:80px; height:80px; border-radius:20px; border:2px solid var(--border); background:rgba(255,255,255,0.05); color:var(--text); font-family:'Fredoka One',cursive; font-size:1.6rem; cursor:pointer; transition:all 0.2s cubic-bezier(0.34,1.56,0.64,1); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  .count-btn small { font-family:'Nunito',sans-serif; font-size:0.65rem; font-weight:700; color:var(--muted); }
  .count-btn:hover { transform:scale(1.08); }
  .count-btn.vocab-sel:hover,.count-btn.vocab-sel.selected { border-color:var(--accent1); background:rgba(245,158,11,0.15); box-shadow:0 0 20px rgba(245,158,11,0.3); }
  .count-btn.grammar-sel:hover,.count-btn.grammar-sel.selected { border-color:var(--accent4); background:rgba(99,102,241,0.15); box-shadow:0 0 20px rgba(99,102,241,0.3); }
  .count-btn.reading-sel:hover,.count-btn.reading-sel.selected { border-color:var(--accent2); background:rgba(16,185,129,0.15); box-shadow:0 0 20px rgba(16,185,129,0.3); }
  .modal-confirm-btn { width:100%; padding:14px; border:none; border-radius:16px; font-family:'Fredoka One',cursive; font-size:1.1rem; cursor:pointer; transition:all 0.2s; background:linear-gradient(135deg,var(--accent4),#818cf8); color:#fff; }
  .modal-confirm-btn:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(99,102,241,0.4); }
  .modal-confirm-btn:disabled { opacity:0.4; cursor:default; transform:none; box-shadow:none; }
  .modal-cancel { margin-top:12px; font-size:0.85rem; color:var(--muted); cursor:pointer; }
  .modal-cancel:hover { color:var(--text); }

  /* Quiz */
  .quiz-header { display:flex; align-items:center; gap:16px; margin-bottom:24px; }
  .back-btn { background:rgba(255,255,255,0.08); border:1px solid var(--border); color:var(--text); border-radius:12px; padding:8px 16px; cursor:pointer; font-family:'Nunito',sans-serif; font-size:0.85rem; font-weight:700; transition:all 0.2s; }
  .back-btn:hover { background:rgba(255,255,255,0.15); }
  .quiz-meta { flex:1; }
  .quiz-title { font-family:'Fredoka One',cursive; font-size:1.4rem; }
  .quiz-sub { font-size:0.8rem; color:var(--muted); }
  .progress-track { background:rgba(255,255,255,0.08); border-radius:10px; height:8px; overflow:hidden; margin-bottom:24px; }
  .progress-fill { height:100%; border-radius:10px; background:linear-gradient(90deg,var(--accent4),var(--accent2)); transition:width 0.5s cubic-bezier(0.34,1.56,0.64,1); }

  /* Question Card */
  .question-card { background:var(--card); border:1px solid var(--border); border-radius:24px; padding:32px; margin-bottom:0; position:relative; overflow:hidden; }
  .question-card::after { content:''; position:absolute; top:-50%; right:-30%; width:300px; height:300px; border-radius:50%; background:radial-gradient(circle,rgba(99,102,241,0.05) 0%,transparent 70%); pointer-events:none; }
  .q-type-badge { display:inline-block; font-size:0.7rem; font-weight:800; letter-spacing:1px; text-transform:uppercase; padding:4px 12px; border-radius:20px; margin-bottom:14px; }
  .q-type-badge.vocab { background:rgba(245,158,11,0.2); color:var(--accent1); }
  .q-type-badge.grammar { background:rgba(99,102,241,0.2); color:var(--accent4); }
  .q-type-badge.reading { background:rgba(16,185,129,0.2); color:var(--accent2); }
  .reading-passage { background:rgba(255,255,255,0.04); border-left:3px solid var(--accent2); border-radius:0 12px 12px 0; padding:14px 18px; margin-bottom:18px; font-size:0.92rem; line-height:1.8; color:#cbd5e1; }
  .question-text { font-size:clamp(1rem,3vw,1.2rem); font-weight:700; line-height:1.5; margin-bottom:6px; }
  .question-hint { font-size:0.82rem; color:var(--muted); margin-bottom:20px; font-style:italic; }
  .options-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .option-btn { background:rgba(255,255,255,0.05); border:2px solid var(--border); border-radius:14px; padding:14px 18px; color:var(--text); font-family:'Nunito',sans-serif; font-size:0.9rem; font-weight:700; cursor:pointer; text-align:left; transition:all 0.2s cubic-bezier(0.34,1.56,0.64,1); display:flex; align-items:center; gap:10px; }
  .option-btn:hover:not(:disabled) { background:rgba(255,255,255,0.1); border-color:rgba(255,255,255,0.3); transform:scale(1.02); }
  .option-btn:disabled { cursor:default; }
  .option-btn.correct { background:rgba(16,185,129,0.2); border-color:var(--accent2); color:var(--accent2); animation:pulse-green 0.4s ease; }
  .option-btn.wrong { background:rgba(239,68,68,0.15); border-color:var(--accent3); color:#fca5a5; animation:shake 0.4s ease; }
  @keyframes pulse-green { 0%{transform:scale(1)} 50%{transform:scale(1.04)} 100%{transform:scale(1)} }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .option-letter { width:26px; height:26px; border-radius:8px; background:rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center; font-size:0.78rem; font-weight:800; flex-shrink:0; }
  .feedback-banner { border-radius:14px; padding:14px 18px; display:none; align-items:center; gap:12px; margin-top:14px; animation:popIn 0.3s cubic-bezier(0.34,1.56,0.64,1); }
  .feedback-banner.correct { background:rgba(16,185,129,0.15); border:1px solid rgba(16,185,129,0.4); }
  .feedback-banner.wrong { background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3); }
  .feedback-icon { font-size:1.8rem; }
  .feedback-text strong { display:block; font-size:0.95rem; margin-bottom:3px; }
  .feedback-text span { font-size:0.82rem; color:var(--muted); }
  .next-btn { width:100%; padding:15px; background:linear-gradient(135deg,var(--accent4),#818cf8); border:none; border-radius:16px; color:#fff; font-family:'Fredoka One',cursive; font-size:1.1rem; cursor:pointer; transition:all 0.2s; margin-top:14px; }
  .next-btn:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(99,102,241,0.5); }

  /* Results */
  #results-screen { text-align:center; padding:40px 20px; }
  .result-trophy { font-size:5rem; margin-bottom:14px; animation:trophy 1s ease; }
  @keyframes trophy { 0%{transform:scale(0) rotate(-20deg);opacity:0} 60%{transform:scale(1.2) rotate(5deg)} 100%{transform:scale(1) rotate(0);opacity:1} }
  .result-title { font-family:'Fredoka One',cursive; font-size:2.2rem; margin-bottom:8px; background:linear-gradient(135deg,var(--accent1),var(--accent4)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .score-big { font-family:'Fredoka One',cursive; font-size:4rem; display:block; margin:12px 0; background:linear-gradient(135deg,var(--accent2),var(--accent4)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .xp-gained { display:inline-flex; align-items:center; gap:8px; background:rgba(245,158,11,0.15); border:1px solid rgba(245,158,11,0.3); border-radius:20px; padding:10px 24px; margin-bottom:28px; font-weight:800; color:var(--accent1); }
  .result-actions { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .result-btn { padding:14px 28px; border-radius:16px; font-family:'Fredoka One',cursive; font-size:1rem; cursor:pointer; border:none; transition:all 0.2s; }
  .result-btn.primary { background:linear-gradient(135deg,var(--accent4),#818cf8); color:#fff; }
  .result-btn.secondary { background:rgba(255,255,255,0.08); color:var(--text); border:1px solid var(--border); }
  .result-btn:hover { transform:translateY(-3px); }

  /* Confetti */
  .confetti-container { position:fixed; inset:0; pointer-events:none; z-index:999; }
  .confetti-piece { position:absolute; top:-20px; border-radius:2px; animation:confettiFall linear forwards; }
  @keyframes confettiFall { to{transform:translateY(110vh) rotate(720deg);opacity:0} }

  @media(max-width:600px) {
    .levels-grid { grid-template-columns:1fr; }
    .options-grid { grid-template-columns:1fr; }
    .stats-bar .stat-chip:last-child { display:none; }
    main { padding:20px 16px; }
    .count-options { gap:8px; }
    .count-btn { width:68px; height:68px; font-size:1.4rem; }
  }
</style>
</head>
<body>
<div class="stars"></div>
<div class="app">

  <header>
    <div class="logo">English<span>Quest</span> 🚀</div>
    <div class="stats-bar">
      <div class="stat-chip xp">⭐ <span id="xp-count">0</span> XP</div>
      <div class="stat-chip streak">🔥 <span id="streak-count">0</span></div>
      <div class="stat-chip level">🏅 Lv.<span id="level-count">1</span></div>
    </div>
  </header>

  <main>
    <!-- Home -->
    <div id="home-screen">
      <div class="hero">
        <span class="hero-emoji">🌟</span>
        <h1>英語冒險，出發！</h1>
        <p>選擇關卡，挑選題數，開始闖關！</p>
      </div>
      <div class="world-label">⚔️ 選擇關卡</div>
      <div class="levels-grid">
        <div class="level-card vocab" onclick="openModal('vocab')">
          <span class="level-icon">📚</span>
          <div class="level-name">單字王國</div>
          <div class="level-desc">Vocabulary Challenge<br>考驗你的英文單字量！</div>
          <div class="level-count">題庫共 <span>15</span> 題</div>
          <button class="start-btn">開始闖關 ▶</button>
        </div>
        <div class="level-card grammar" onclick="openModal('grammar')">
          <span class="level-icon">⚡</span>
          <div class="level-name">文法要塞</div>
          <div class="level-desc">Grammar Fortress<br>征服英文文法規則！</div>
          <div class="level-count">題庫共 <span>15</span> 題</div>
          <button class="start-btn">開始闖關 ▶</button>
        </div>
        <div class="level-card reading" onclick="openModal('reading')">
          <span class="level-icon">🔍</span>
          <div class="level-name">閱讀秘境</div>
          <div class="level-desc">Reading Adventure<br>探索英文閱讀理解！</div>
          <div class="level-count">題庫共 <span>15</span> 題</div>
          <button class="start-btn">開始闖關 ▶</button>
        </div>
      </div>
    </div>

    <!-- Quiz -->
    <div id="quiz-screen">
      <div class="quiz-header">
        <button class="back-btn" onclick="goHome()">← 返回</button>
        <div class="quiz-meta">
          <div class="quiz-title" id="quiz-title"></div>
          <div class="quiz-sub" id="quiz-sub"></div>
        </div>
        <div class="stat-chip xp"><span id="quiz-score">0</span> / <span id="quiz-total">5</span></div>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      <div id="question-area"></div>
    </div>

    <!-- Results -->
    <div id="results-screen">
      <div class="result-trophy" id="result-trophy">🏆</div>
      <div class="result-title" id="result-title"></div>
      <div style="color:var(--muted);font-size:1rem;">你答對了</div>
      <span class="score-big" id="score-display"></span>
      <div class="xp-gained">⭐ 獲得 <span id="xp-gained-display">0</span> XP！</div>
      <div class="result-actions">
        <button class="result-btn primary" id="play-again-btn">再來一局 🔄</button>
        <button class="result-btn secondary" onclick="goHome()">選其他關卡 🗺️</button>
      </div>
    </div>

    <!-- Modal -->
    <div id="count-modal" style="display:none;">
      <div class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-box">
          <div class="modal-icon" id="modal-icon">📚</div>
          <div class="modal-title" id="modal-title"></div>
          <div class="modal-sub">選擇這次要練習幾題？</div>
          <div class="count-options" id="count-options"></div>
          <button class="modal-confirm-btn" id="modal-confirm" onclick="confirmStart()" disabled>開始挑戰 ▶</button>
          <div class="modal-cancel" onclick="document.getElementById('count-modal').style.display='none'">✕ 取消</div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="confetti-container" id="confetti-container"></div>

<script>
// ════════════════════════════════════════════
// 題庫 QUESTION BANK
// ════════════════════════════════════════════
const QUESTION_BANK = {

  vocab: [
    {
      question: "'Dog' 的中文意思是？",
      hint: "這是一種常見的寵物，會汪汪叫！",
      passage: null,
      options: ["狗", "貓", "鳥", "魚"],
      answer: 0,
      explanation: "'Dog' 的中文是「狗」。Dogs are popular pets!"
    },
    {
      question: "Which word means 'happy' in English?",
      hint: "你生日的時候會有這種感覺！",
      passage: null,
      options: ["sad（難過）", "happy（開心）", "angry（生氣）", "tired（累）"],
      answer: 1,
      explanation: "'Happy' 就是開心、高興的意思。I am happy today!"
    },
    {
      question: "'Hungry' 的中文意思是？",
      hint: "午飯前你的肚子會這樣！",
      passage: null,
      options: ["口渴", "肚子餓", "睡著", "開心"],
      answer: 1,
      explanation: "'Hungry' 是肚子餓的意思。I am hungry. Let's eat!"
    },
    {
      question: "Which word is a fruit?（哪個是水果？）",
      hint: "水果是可以吃的植物果實。",
      passage: null,
      options: ["pencil（鉛筆）", "chair（椅子）", "apple（蘋果）", "window（窗戶）"],
      answer: 2,
      explanation: "'Apple'（蘋果）是水果。Pencil 是鉛筆，chair 是椅子，window 是窗戶。"
    },
    {
      question: "'Library' 的中文意思是？",

// ════════════════════════════════════════════
// NAVIGATION
// ════════════════════════════════════════════
function show(id) {
  ['home-screen','quiz-screen','results-screen'].forEach(s => {
    const el = document.getElementById(s);
    el.style.display = 'none';
    el.style.animation = 'none';
  });
  const target = document.getElementById(id);
  target.style.display = 'block';
  requestAnimationFrame(() => { target.style.animation = 'fadeIn 0.5s ease'; });
}

function goHome() { show('home-screen'); }

// ════════════════════════════════════════════
// MODAL
// ════════════════════════════════════════════
function openModal(type) {
  pendingQuizType = type;
  selectedCount = 0;
  const meta = QUIZ_META[type];
  const bankSize = QUESTION_BANK[type].length;
  document.getElementById('modal-icon').textContent = meta.icon;
  document.getElementById('modal-title').textContent = meta.title;
  document.getElementById('modal-confirm').disabled = true;

  // Build count buttons — only show options that fit the bank size
  const counts = [5, 10, 15].filter(n => n <= bankSize);
  document.getElementById('count-options').innerHTML = counts.map(n => `
    <button class="count-btn ${type}-sel" onclick="selectCount(${n})" id="cnt-${n}">
      ${n}<small>題</small>
    </button>`).join('');

  document.getElementById('count-modal').style.display = 'block';
}

function selectCount(n) {
  selectedCount = n;
  document.querySelectorAll('.count-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById('cnt-' + n).classList.add('selected');
  document.getElementById('modal-confirm').disabled = false;
}

function confirmStart() {
  document.getElementById('count-modal').style.display = 'none';
  startQuiz(pendingQuizType, selectedCount);
}

function closeModal(e) {
  if (e.target.classList.contains('modal-overlay'))
    document.getElementById('count-modal').style.display = 'none';
}

// ════════════════════════════════════════════
// QUIZ
// ════════════════════════════════════════════
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz(type, count) {
  currentQuizType = type;
  currentQ = 0;
  correctCount = 0;
  answered = false;

  // Shuffle and pick `count` questions
  questions = shuffle(QUESTION_BANK[type]).slice(0, count);

  const meta = QUIZ_META[type];
  document.getElementById('quiz-title').textContent = meta.title;
  document.getElementById('quiz-sub').textContent = `第 1 / ${count} 題`;
  document.getElementById('quiz-score').textContent = '0';
  document.getElementById('quiz-total').textContent = count;
  document.getElementById('progress-fill').style.width = '0%';

  show('quiz-screen');
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const q = questions[currentQ];
  const total = questions.length;
  const meta = QUIZ_META[currentQuizType];
  const progress = (currentQ / total) * 100;

  document.getElementById('progress-fill').style.width = progress + '%';
  document.getElementById('quiz-sub').textContent = `第 ${currentQ + 1} / ${total} 題`;
  document.getElementById('quiz-score').textContent = correctCount;

  const letters = ['A', 'B', 'C', 'D'];
  const passageHTML = q.passage
    ? `<div class="reading-passage">${q.passage}</div>` : '';
  const nextLabel = currentQ + 1 < total ? '下一題 →' : '查看成績 🏆';

  document.getElementById('question-area').innerHTML = `
    <div class="question-card">
      <span class="q-type-badge ${meta.badge}">${meta.icon} ${currentQuizType === 'vocab' ? '單字' : currentQuizType === 'grammar' ? '文法' : '閱讀'}</span>
      ${passageHTML}
      <div class="question-text">${q.question}</div>
      ${q.hint ? `<div class="question-hint">💡 提示：${q.hint}</div>` : ''}
      <div class="options-grid">
        ${q.options.map((opt, i) => `
          <button class="option-btn" onclick="selectAnswer(${i})" id="opt-${i}">
            <span class="option-letter">${letters[i]}</span>${opt}
          </button>`).join('')}
      </div>
      <div class="feedback-banner" id="feedback"></div>
      <button class="next-btn" id="next-btn" onclick="nextQuestion()" style="display:none;">${nextLabel}</button>
    </div>`;
}

function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[currentQ];
  const correct = q.answer;
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.disabled = true);
  btns[idx].classList.add(idx === correct ? 'correct' : 'wrong');
  if (idx !== correct) btns[correct].classList.add('correct');

  const isRight = idx === correct;
  if (isRight) { correctCount++; document.getElementById('quiz-score').textContent = correctCount; spawnStars(); }

  const fb = document.getElementById('feedback');
  fb.className = `feedback-banner ${isRight ? 'correct' : 'wrong'}`;
  fb.style.display = 'flex';
  fb.innerHTML = `
    <div class="feedback-icon">${isRight ? '🎉' : '😅'}</div>
    <div class="feedback-text">
      <strong>${isRight ? '答對了！Great job! 🌟' : '答錯了！Keep going! 💪'}</strong>
      <span>${q.explanation}</span>
    </div>`;
  document.getElementById('next-btn').style.display = 'block';
}

function nextQuestion() {
  currentQ++;
  if (currentQ >= questions.length) showResults();
  else renderQuestion();
}

// ════════════════════════════════════════════
// RESULTS
// ════════════════════════════════════════════
function showResults() {
  const total = questions.length;
  const pct = Math.round(correctCount / total * 100);
  const xpGained = correctCount * 10 + (pct === 100 ? 20 : 0);
  xp += xpGained; streak++; if (xp >= level * 100) level++;
  document.getElementById('xp-count').textContent = xp;
  document.getElementById('streak-count').textContent = streak;
  document.getElementById('level-count').textContent = level;

  let trophy, title;
  if (pct === 100)      { trophy = '🏆'; title = '完美滿分！你是英語勇士！'; }
  else if (pct >= 80)   { trophy = '🥇'; title = '太厲害了！繼續加油！'; }
  else if (pct >= 60)   { trophy = '🥈'; title = '不錯喔！再練習一次吧！'; }
  else                   { trophy = '💪'; title = '繼續努力！你做得到的！'; }

  document.getElementById('result-trophy').textContent = trophy;
  document.getElementById('result-title').textContent = title;
  document.getElementById('score-display').textContent = `${correctCount}/${total}`;
  document.getElementById('xp-gained-display').textContent = xpGained;
  document.getElementById('play-again-btn').onclick = () => openModal(currentQuizType);

  show('results-screen');
  if (pct >= 80) launchConfetti();
}

// ════════════════════════════════════════════
// EFFECTS
// ════════════════════════════════════════════
function spawnStars() {
  for (let i = 0; i < 6; i++) {
    const s = document.createElement('div');
    s.textContent = ['⭐','✨','💫'][Math.floor(Math.random()*3)];
    s.style.cssText = `position:fixed;font-size:${1+Math.random()}rem;left:${20+Math.random()*60}vw;top:${30+Math.random()*30}vh;pointer-events:none;z-index:999;animation:floatAway 1s ease forwards;`;
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 1000);
  }
}

function launchConfetti() {
  const colors = ['#f59e0b','#6366f1','#10b981','#ef4444','#ec4899','#06b6d4'];
  const c = document.getElementById('confetti-container');
  for (let i = 0; i < 60; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    const size = 6 + Math.random() * 10;
    p.style.cssText = `left:${Math.random()*100}vw;width:${size}px;height:${size}px;background:${colors[Math.floor(Math.random()*colors.length)]};border-radius:${Math.random()>.5?'50%':'2px'};animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*0.5}s;`;
    c.appendChild(p);
  }
  setTimeout(()=>{ c.innerHTML=''; }, 4500);
}

const styleEl = document.createElement('style');
styleEl.textContent = `@keyframes floatAway{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-60px) scale(1.5)}}`;
document.head.appendChild(styleEl);
</script>
</body>
